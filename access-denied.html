<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Anbel Car Rental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        'primary-dark': '#1e3a8a',
                        accent: '#f59e0b',
                        sidebar: '#0f172a',
                        'sidebar-hover': '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full text-center">
        <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-shield-halved text-red-500 text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Access Denied</h1>
        <p class="text-gray-500 mb-1">You do not have permission to access this page.</p>
        <p id="deniedPage" class="text-sm text-gray-400 mb-6 font-mono bg-gray-50 px-3 py-1.5 rounded-lg inline-block"></p>
        <p class="text-sm text-gray-500 mb-8">Please contact your Administrator if you believe this is an error.</p>
        <a id="backToDashboard" href="dashboard.html" class="inline-flex items-center gap-2 px-6 py-3 bg-primary hover:bg-blue-700 text-white rounded-xl font-medium transition">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var from = params.get('from') || 'this page';
        document.getElementById('deniedPage').textContent = from;

        var role = localStorage.getItem('staffRole') || 'admin';
        var dashboardUrl = role === 'staff' ? 'staff-index.html' :
                           role === 'supervisor' ? 'supervisor-index.html' :
                           'dashboard.html';
        document.getElementById('backToDashboard').href = dashboardUrl;
    </script>

</body>
</html>
